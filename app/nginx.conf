server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses and error pages.
    server_tokens off;

    # Security headers. `always` so they are also sent on error responses.
    #
    # The bundle is fully self-hosted (JS, CSS and the woff2 fonts all ship from
    # /assets), so everything can default to 'self'. The single exception is the
    # Feiertage API, the app's only outbound request — see src/lib/holidays.ts.
    #
    # style-src keeps 'unsafe-inline' because the popover/calendar components
    # position themselves with inline styles at runtime. That is a far weaker
    # relaxation than it sounds: it permits no script execution. script-src,
    # which is what actually contains XSS, stays strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://feiertage-api.de; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

    # HSTS. Enable only once the domain serves HTTPS and "Force HTTPS" is on in
    # Coolify — browsers cache this for max-age and will refuse plain HTTP until
    # it expires, so turning it on too early can make the site unreachable.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
